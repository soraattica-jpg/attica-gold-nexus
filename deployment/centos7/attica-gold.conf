<VirtualHost *:80>
    ServerName atticagold.xyz
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3001/api/ retry=0 timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    ErrorLog /var/log/httpd/attica-gold-error.log
    CustomLog /var/log/httpd/attica-gold-access.log combined
</VirtualHost>
