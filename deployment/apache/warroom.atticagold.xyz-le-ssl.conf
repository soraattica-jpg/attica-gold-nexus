<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName warroom.atticagold.xyz
    DocumentRoot /var/www/warroom-atticagold

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://192.168.122.118:8080/
    ProxyPassReverse / http://192.168.122.118:8080/

    <Location "/.well-known/acme-challenge/">
        Require all granted
        Satisfy any
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/warroom_atticagold_error.log
    CustomLog ${APACHE_LOG_DIR}/warroom_atticagold_access.log combined

SSLCertificateFile /etc/letsencrypt/live/warroom.atticagold.xyz/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/warroom.atticagold.xyz/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
