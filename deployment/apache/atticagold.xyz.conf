<VirtualHost *:80>
    ServerName atticagold.xyz
    ServerAlias www.atticagold.xyz

    DocumentRoot /var/www/html
    DirectoryIndex index.html index.php

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/
    ProxyPass /api http://127.0.0.1:3001/api
    ProxyPassReverse /api http://127.0.0.1:3001/api
    ProxyPass /recordings/ http://127.0.0.1:3001/api/recordings/
    ProxyPassReverse /recordings/ http://127.0.0.1:3001/api/recordings/
    ProxyPass /recordings http://127.0.0.1:3001/api/recordings
    ProxyPassReverse /recordings http://127.0.0.1:3001/api/recordings

    ErrorLog ${APACHE_LOG_DIR}/atticagold_error.log
    CustomLog ${APACHE_LOG_DIR}/atticagold_access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =atticagold.xyz [OR]
    RewriteCond %{SERVER_NAME} =www.atticagold.xyz
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
