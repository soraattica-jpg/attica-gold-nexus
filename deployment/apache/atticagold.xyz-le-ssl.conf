<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName atticagold.xyz
    ServerAlias www.atticagold.xyz

    DocumentRoot /var/www/html
    DirectoryIndex index.html index.php

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/atticagold_error.log
    CustomLog ${APACHE_LOG_DIR}/atticagold_access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/atticagold.xyz-0001/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/atticagold.xyz-0001/privkey.pem
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
    ProxyPass /api http://127.0.0.1:3001/api
    ProxyPassReverse /api http://127.0.0.1:3001/api
</VirtualHost>
</IfModule>
